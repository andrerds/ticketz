version: "3.8"

volumes:
  postgres_data:
  redis_data:
  backend_public:
  backend_private:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ticketz}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      PORT: 8080
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-ticketz}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-ticketz}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      REDIS_OPT_LIMITER_MAX: ${REDIS_OPT_LIMITER_MAX:-1}
      REDIS_OPT_LIMITER_DURATION: ${REDIS_OPT_LIMITER_DURATION:-3000}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      USER_LIMIT: ${USER_LIMIT:-10000}
      CONNECTIONS_LIMIT: ${CONNECTIONS_LIMIT:-100000}
      CLOSED_SEND_BY_ME: ${CLOSED_SEND_BY_ME:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_CREDENTIALS_KEY: ${STORAGE_CREDENTIALS_KEY}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-admin@ticketz.host}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - backend_public:/usr/src/app/public
      - backend_private:/usr/src/app/private
      - ./confs/pg_hba.conf:/var/lib/postgresql/pg_hba.conf:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      PORT: 3000
      BACKEND_SERVICE: backend
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PROTOCOL: ${BACKEND_PROTOCOL:-https}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      BACKEND_PATH: ${BACKEND_PATH:-/backend}
      FRONTEND_HOST: ${FRONTEND_HOST}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS}
    volumes:
      - backend_public:/var/www/backend-public:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    depends_on:
      - backend
    restart: unless-stopped
